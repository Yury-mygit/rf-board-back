[project]
name = "board-app"
version = "0.1.0"
description = "Board — independent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "cairosvg>=2.7.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
# BRD-24 / REG-2: test harness. Pilot для платформы — реф. установки
# pytest + async fixtures. Живёт как optional-dep чтобы prod-image мог
# ставить без dev-deps (`pip install -e '.[test]'`).
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped event loop — иначе global AsyncSessionLocal engine's
# connection pool "переезжает" между loops и получаем InterfaceError
# 'another operation in progress' на 2-м+ тесте.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
